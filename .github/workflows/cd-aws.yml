# RAGLab — AWS Continuous Deployment
#
# Triggered on push to main (after CI passes).
# Pipeline:
#   1. Build Docker images for all active services
#   2. Push to Amazon Elastic Container Registry (ECR)
#   3. Deploy to Amazon ECS (Fargate)
#
# Required GitHub Secrets:
#   AWS_ACCOUNT_ID               — 12-digit AWS account ID
#   AWS_REGION                   — e.g. us-east-1
#   AWS_ROLE_ARN                 — IAM role ARN for OIDC (no static keys)
#   ECS_CLUSTER                  — ECS cluster name
#   ECR_REGISTRY                 — e.g. 123456789012.dkr.ecr.us-east-1.amazonaws.com
#
# Authentication: OIDC via AWS IAM Identity Provider (no AWS_ACCESS_KEY_ID stored).
# All LLM API keys read from AWS Secrets Manager at task startup — never plain env vars.

name: CD — AWS

"on":
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      services:
        description: "Comma-separated services to redeploy (empty = all)"
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

concurrency:
  group: cd-aws-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ── Build and push to ECR ────────────────────────────────────────────────────
  build-push:
    name: Build & push ECR — ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - api-gateway
          - ingestion
          - embedding
          - indexing
          - retrieval
          - llm
          - pipeline
          - storage
          - ui
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories \
            --repository-names raglab/${{ matrix.service }} \
            --region ${{ env.AWS_REGION }} 2>/dev/null || \
          aws ecr create-repository \
            --repository-name raglab/${{ matrix.service }} \
            --region ${{ env.AWS_REGION }} \
            --image-scanning-configuration scanOnPush=true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/raglab/${{ matrix.service }}:${{ env.IMAGE_TAG }}
            ${{ env.ECR_REGISTRY }}/raglab/${{ matrix.service }}:latest
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/raglab/${{ matrix.service }}:buildcache
          cache-to: type=registry,ref=${{ env.ECR_REGISTRY }}/raglab/${{ matrix.service }}:buildcache,mode=max

  # ── Update ECS task definitions and services ─────────────────────────────────
  deploy-aws:
    name: Deploy — AWS ECS
    runs-on: ubuntu-latest
    needs: build-push
    environment: production-aws

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update ECS services
        run: |
          CLUSTER="${{ secrets.ECS_CLUSTER }}"
          SERVICES="api-gateway ingestion embedding indexing retrieval llm pipeline storage ui"

          for SERVICE in $SERVICES; do
            ECS_SERVICE="raglab-${SERVICE}"
            TASK_FAMILY="raglab-${SERVICE}"
            IMAGE="${{ env.ECR_REGISTRY }}/raglab/${SERVICE}:${{ env.IMAGE_TAG }}"
            echo "Updating ${ECS_SERVICE} to ${IMAGE}"

            # Fetch current task definition — skip service if not found
            TASK_DEF_ARN=$(aws ecs describe-task-definition \
              --task-definition "${TASK_FAMILY}" \
              --query "taskDefinition.taskDefinitionArn" \
              --output text 2>/dev/null || true)

            if [ -z "$TASK_DEF_ARN" ] || [ "$TASK_DEF_ARN" = "None" ]; then
              echo "Task family ${TASK_FAMILY} not found — skipping (first deploy via Terraform)"
              continue
            fi

            # Build new task definition JSON with updated image using jq
            NEW_TASK_DEF=$(aws ecs describe-task-definition \
              --task-definition "${TASK_FAMILY}" \
              --query "taskDefinition" \
              --output json | \
              jq --arg IMAGE "$IMAGE" \
                 '.containerDefinitions[0].image = $IMAGE |
                  del(.taskDefinitionArn, .revision, .status,
                      .requiresAttributes, .placementConstraints,
                      .compatibilities, .registeredAt, .registeredBy)')

            # Register new task definition revision
            NEW_ARN=$(aws ecs register-task-definition \
              --cli-input-json "$NEW_TASK_DEF" \
              --query "taskDefinition.taskDefinitionArn" \
              --output text)

            echo "Registered: ${NEW_ARN}"

            # Update ECS service to use the new revision
            aws ecs update-service \
              --cluster "$CLUSTER" \
              --service "$ECS_SERVICE" \
              --task-definition "$NEW_ARN" \
              --force-new-deployment \
              --output text \
              --query "service.serviceArn" || \
            echo "Service ${ECS_SERVICE} not found — may not exist yet (Terraform first-run)"
          done

      - name: Wait for ECS stabilisation
        run: |
          CLUSTER="${{ secrets.ECS_CLUSTER }}"
          CORE_SERVICES="api-gateway ingestion embedding indexing retrieval llm pipeline"
          for SERVICE in $CORE_SERVICES; do
            echo "Waiting for raglab-${SERVICE}..."
            aws ecs wait services-stable \
              --cluster "$CLUSTER" \
              --services "raglab-${SERVICE}" \
              --region ${{ env.AWS_REGION }} 2>/dev/null || \
            echo "::warning::Service raglab-${SERVICE} did not stabilise within timeout"
          done
          echo "ECS stabilisation check complete"

      - name: Health check via ALB
        run: |
          ALB_DNS=$(aws cloudformation describe-stacks \
            --stack-name raglab-stack \
            --query "Stacks[0].Outputs[?OutputKey=='GatewayDNS'].OutputValue" \
            --output text 2>/dev/null || true)

          if [ -n "$ALB_DNS" ] && [ "$ALB_DNS" != "None" ]; then
            STATUS=$(curl -sf "http://${ALB_DNS}/health" \
              --max-time 10 \
              | jq -r '.status // "unknown"' 2>/dev/null || echo "unreachable")
            echo "Gateway health: ${STATUS}"
            if [ "$STATUS" = "unreachable" ]; then
              echo "::warning::Health check failed — deployment may still be converging"
            fi
          else
            echo "::warning::ALB DNS not found in CloudFormation — skipping health check"
          fi

      - name: Notify deployment
        if: always()
        run: |
          echo "AWS ECS deployment complete"
          echo "Image tag: ${{ env.IMAGE_TAG }}"
          echo "Cluster:   ${{ secrets.ECS_CLUSTER }}"
          echo "Region:    ${{ env.AWS_REGION }}"
          echo "Triggered: ${{ github.actor }} @ ${{ github.sha }}"
