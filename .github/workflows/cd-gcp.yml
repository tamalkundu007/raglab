# RAGLab — GCP Continuous Deployment (R7 — Activated)
#
# Pipeline: lint → test → build → push to Artifact Registry → deploy to GKE
# Auth:     Workload Identity Federation (OIDC) — no static service account keys
# State:    Terraform state in GCS bucket (remote backend)

name: CD — GCP

on:
  push:
    branches: [main, release/r7]
    paths-ignore:
      - "docs/**"
      - "*.md"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options: [staging, prod]

env:
  GCP_REGION:          ${{ vars.GCP_REGION }}
  GCP_PROJECT_ID:      ${{ vars.GCP_PROJECT_ID }}
  GAR_LOCATION:        ${{ vars.GAR_LOCATION || vars.GCP_REGION }}
  GAR_REPO:            raglab
  GKE_CLUSTER:         raglab-${{ github.event.inputs.environment || 'staging' }}
  ENVIRONMENT:         ${{ github.event.inputs.environment || 'staging' }}
  IMAGE_TAG:           ${{ github.sha }}

jobs:
  # ── Lint + Test ──────────────────────────────────────────────────────────────
  test:
    name: Lint + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Lint (ruff)
        run: uv run ruff check packages/ services/

      - name: Run tests
        run: uv run pytest packages/ services/ tests/ -q --tb=short
        env:
          RAGLAB_ENV: ci

  # ── Build + push images ──────────────────────────────────────────────────────
  build:
    name: Build & Push
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for Workload Identity Federation

    strategy:
      matrix:
        service:
          - api-gateway
          - ingestion
          - embedding
          - indexing
          - retrieval
          - llm
          - pipeline
          - storage
          - ui
          - graph
          - auth
          - observability

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP (Workload Identity Federation)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account:            ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Build and push ${{ matrix.service }}
        run: |
          IMAGE="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPO }}/${{ matrix.service }}:${{ env.IMAGE_TAG }}"
          docker build \
            --build-arg SERVICE=${{ matrix.service }} \
            --tag $IMAGE \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            -f services/${{ matrix.service }}/Dockerfile \
            .
          docker push $IMAGE
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

  # ── Terraform plan ────────────────────────────────────────────────────────────
  terraform-plan:
    name: Terraform Plan (GCP)
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account:            ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.7"

      - name: Terraform Init
        working-directory: infra/terraform/gcp
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=raglab/${{ env.ENVIRONMENT }}"

      - name: Terraform Plan
        working-directory: infra/terraform/gcp
        run: |
          terraform plan \
            -var="project_id=${{ vars.GCP_PROJECT_ID }}" \
            -var="region=${{ env.GCP_REGION }}" \
            -var="environment=${{ env.ENVIRONMENT }}" \
            -var="image_tag=${{ env.IMAGE_TAG }}" \
            -out=tfplan
        env:
          GOOGLE_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}

  # ── Deploy ────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to GKE
    needs: [build, terraform-plan]
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account:            ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location:     ${{ env.GCP_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Apply
        working-directory: infra/terraform/gcp
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="prefix=raglab/${{ env.ENVIRONMENT }}"
          terraform apply -auto-approve \
            -var="project_id=${{ vars.GCP_PROJECT_ID }}" \
            -var="region=${{ env.GCP_REGION }}" \
            -var="environment=${{ env.ENVIRONMENT }}" \
            -var="image_tag=${{ env.IMAGE_TAG }}"
        env:
          GOOGLE_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}

      - name: Update deployments with new images
        run: |
          GAR_BASE="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GAR_REPO }}"
          for SERVICE in api-gateway ingestion embedding indexing retrieval llm pipeline storage ui graph auth observability; do
            kubectl set image deployment/raglab-${SERVICE} \
              ${SERVICE}=${GAR_BASE}/${SERVICE}:${{ env.IMAGE_TAG }} \
              -n raglab --record || true
          done

      - name: Wait for rollout
        run: |
          for SERVICE in api-gateway retrieval llm pipeline; do
            kubectl rollout status deployment/raglab-${SERVICE} \
              -n raglab --timeout=300s
          done

      - name: Smoke test
        run: |
          GW_IP=$(kubectl get service raglab-api-gateway -n raglab \
            -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "pending")
          echo "Gateway IP: $GW_IP"
          if [ "$GW_IP" != "pending" ]; then
            curl -sf "http://${GW_IP}/health" | grep '"status":"ok"' || \
              echo "Health check pending — deployment may still be rolling out"
          fi
