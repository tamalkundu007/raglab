[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "raglab-chunkers"
version = "0.2.0"
description = "Chunker implementations for RAGLab"
requires-python = ">=3.12"
dependencies = [
    "raglab-common",
    "tiktoken>=0.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/raglab_chunkers"]
