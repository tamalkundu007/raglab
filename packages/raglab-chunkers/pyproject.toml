[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "raglab-chunkers"
version = "0.5.0"
description = "Chunker implementations for RAGLab"
requires-python = ">=3.12"
dependencies = [
    "raglab-common",
    "tiktoken>=0.7",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pytesseract>=0.3",
    "pillow>=10.0",
    "pdfplumber>=0.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/raglab_chunkers"]
