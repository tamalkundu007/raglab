[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "raglab-common"
version = "0.1.0"
description = "Shared utilities, models, logging, and exceptions for RAGLab"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "structlog>=24.4",
    "python-dotenv>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/raglab_common"]
