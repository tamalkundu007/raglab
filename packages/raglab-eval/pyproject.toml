[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "raglab-eval"
version = "0.1.0"
description = "RAGLab evaluation package — chunk quality, retrieval feedback, groundedness"
requires-python = ">=3.12"
dependencies = [
    "raglab-common",
    "pydantic>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/raglab_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
