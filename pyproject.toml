[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "raglab"
version = "0.1.0"
description = "RAGLab — A fully configurable RAG Configuration Generator"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Tamal Kundu", email = "tamalkundu007@gmail.com" }]

[tool.uv.workspace]
members = [
    "packages/*",
    "services/*",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["raglab_common", "raglab_chunkers", "raglab_retrievers"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages", "services"]
addopts = "--tb=short -q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::pytest.PytestUnraisableExceptionWarning"]
