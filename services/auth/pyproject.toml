[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "raglab-auth"
version = "0.1.0"
description = "Authentication and multi-tenancy"
requires-python = ">=3.12"
dependencies = [
    "raglab-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/auth"]
