[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "raglab-graph"
version = "0.2.0"
description = "GraphRAG service — knowledge graph construction and retrieval"
requires-python = ">=3.12"
dependencies = [
    "raglab-common",
    "networkx>=3.3",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/graph"]
