[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "raglab-llm"
version = "0.1.0"
description = "LLM provider abstraction — Azure OpenAI, OpenAI, Anthropic, Ollama"
requires-python = ">=3.12"
dependencies = [
    "raglab-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/llm"]
