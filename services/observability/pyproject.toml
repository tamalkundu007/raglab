[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "raglab-observability"
version = "0.2.0"
description = "LLMOps monitoring, evaluation, and tracing"
requires-python = ">=3.12"
dependencies = [
    "raglab-common",
    "sqlalchemy>=2.0",
    "jinja2>=3.1",
    "aiofiles>=23.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/observability"]
