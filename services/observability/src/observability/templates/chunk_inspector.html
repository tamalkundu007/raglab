<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAGLab — Chunk Inspector</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Syne:wght@600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#0a0a0f;--surface:#111118;--card:#1c1c25;--elevated:#18181f;
      --gold:#d4a843;--gold-dim:rgba(212,168,67,.12);
      --text:#f0ede8;--muted:#9a9490;--dim:#5a5650;
      --green:#3ecf8e;--blue:#5e9cf5;--orange:#f0944d;
      --red:#f26464;--purple:#a78bfa;
      --border:rgba(212,168,67,.15);--border-hi:rgba(212,168,67,.45);
      --mono:'JetBrains Mono',monospace;--display:'Syne',sans-serif;--ui:'Space Mono',monospace;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--text);font-family:var(--mono);font-size:13px;line-height:1.6;min-height:100vh}
    ::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:rgba(212,168,67,.25);border-radius:3px}
    .topbar{display:flex;align-items:center;gap:14px;padding:0 20px;height:50px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
    .logo{font-family:var(--display);font-size:15px;font-weight:800;color:var(--gold);text-decoration:none;display:flex;align-items:center;gap:8px}
    .logo-hex{width:22px;height:22px;background:var(--gold);clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--bg);font-weight:800}
    .badge{font-family:var(--ui);font-size:9px;font-weight:700;padding:2px 7px;border-radius:3px;letter-spacing:.08em;text-transform:uppercase;background:rgba(62,207,142,.12);color:var(--green);border:1px solid rgba(62,207,142,.3)}
    .topbar-spacer{flex:1}
    .back-link{font-family:var(--ui);font-size:11px;color:var(--muted);text-decoration:none}
    .back-link:hover{color:var(--gold)}
    .btn{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:5px;font-family:var(--ui);font-size:10px;font-weight:700;cursor:pointer;border:1px solid var(--border);background:var(--elevated);color:var(--muted);transition:all .15s}
    .btn:hover{color:var(--text);border-color:var(--border-hi)}
    .layout{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 50px)}
    .sidebar{background:var(--surface);border-right:1px solid var(--border);overflow-y:auto}
    .sidebar-header{padding:12px 14px;border-bottom:1px solid var(--border);font-family:var(--ui);font-size:9px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--gold)}
    .doc-item{padding:10px 14px;border-bottom:1px solid rgba(212,168,67,.05);cursor:pointer;transition:background .12s}
    .doc-item:hover{background:rgba(212,168,67,.04)}
    .doc-item.active{background:var(--gold-dim);border-left:3px solid var(--gold)}
    .doc-id{font-size:10px;color:var(--muted);margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .doc-meta{font-size:9px;color:var(--dim);display:flex;gap:8px}
    .main{padding:20px;overflow-y:auto}
    .quality-bar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
    .q-stat{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 16px;flex:1;min-width:100px}
    .q-stat-val{font-family:var(--display);font-size:22px;font-weight:800;line-height:1;margin-bottom:3px}
    .q-stat-label{font-size:9px;font-family:var(--ui);text-transform:uppercase;letter-spacing:.1em;color:var(--dim)}
    .filter-row{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
    select,input{background:var(--elevated);border:1px solid var(--border);border-radius:4px;color:var(--text);font-family:var(--mono);font-size:12px;padding:5px 8px;outline:none}
    select:focus,input:focus{border-color:var(--border-hi)}
    .chunk-card{background:var(--card);border:1px solid var(--border);border-radius:8px;margin-bottom:10px;overflow:hidden;transition:border-color .15s}
    .chunk-card:hover{border-color:var(--border-hi)}
    .chunk-card.flagged{border-left:3px solid var(--orange)}
    .chunk-card.excluded{border-left:3px solid var(--red);opacity:.6}
    .chunk-header{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;background:var(--elevated)}
    .chunk-idx{font-family:var(--ui);font-size:9px;color:var(--dim);min-width:28px}
    .chunk-score{font-family:var(--ui);font-size:11px;font-weight:700;min-width:40px}
    .score-good{color:var(--green)}
    .score-warn{color:var(--orange)}
    .score-bad{color:var(--red)}
    .chunk-action{font-size:9px;padding:1px 6px;border-radius:3px;font-family:var(--ui);font-weight:700}
    .action-accepted{background:rgba(62,207,142,.1);color:var(--green);border:1px solid rgba(62,207,142,.25)}
    .action-flagged{background:rgba(240,148,77,.1);color:var(--orange);border:1px solid rgba(240,148,77,.25)}
    .action-excluded{background:rgba(242,100,100,.1);color:var(--red);border:1px solid rgba(242,100,100,.25)}
    .chunk-tokens{font-size:10px;color:var(--dim);margin-left:auto}
    .chunk-body{padding:10px 14px;display:none;border-top:1px solid var(--border)}
    .chunk-body.open{display:block}
    .chunk-text{font-size:11px;color:var(--muted);white-space:pre-wrap;word-break:break-word;max-height:200px;overflow-y:auto;background:var(--elevated);padding:8px;border-radius:4px;margin-bottom:8px}
    .chunk-reason{font-size:10px;color:var(--dim);font-style:italic}
    .empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:48px;color:var(--dim);font-size:12px;text-align:center}
    .spinner{width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .6s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
<header class="topbar">
  <a class="logo" href="{{ control_panel_url }}"><div class="logo-hex">R</div>RAGLab</a>
  <span class="badge">R6 · Chunk Inspector</span>
  <div class="topbar-spacer"></div>
  <a class="back-link" href="{{ control_panel_url }}">← Control Panel</a>
</header>

<div class="layout">
  <div class="sidebar">
    <div class="sidebar-header">Indexed Documents</div>
    <div style="padding:8px 14px;border-bottom:1px solid var(--border)">
      <select id="collection-select" onchange="loadDocs()" style="width:100%">
        <option value="raglab">raglab</option>
      </select>
    </div>
    <div id="doc-list"><div class="doc-item" style="color:var(--dim);font-size:11px">Loading…</div></div>
  </div>

  <div class="main" id="main-panel">
    <div class="empty-state" id="empty-state">
      <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
        <rect x="4" y="6" width="32" height="4" rx="2" fill="currentColor" opacity=".3"/>
        <rect x="4" y="14" width="24" height="4" rx="2" fill="currentColor" opacity=".2"/>
        <rect x="4" y="22" width="28" height="4" rx="2" fill="currentColor" opacity=".15"/>
        <rect x="4" y="30" width="20" height="4" rx="2" fill="currentColor" opacity=".1"/>
      </svg>
      <div>Select a document to inspect its chunks.</div>
    </div>
    <div id="chunk-view" style="display:none">
      <div class="quality-bar" id="quality-bar"></div>
      <div class="filter-row">
        <select id="action-filter" onchange="filterChunks()">
          <option value="">All chunks</option>
          <option value="accepted">Accepted</option>
          <option value="flagged">Flagged</option>
          <option value="excluded">Excluded</option>
        </select>
        <select id="sort-by" onchange="filterChunks()">
          <option value="index">Sort by index</option>
          <option value="score_asc">Score ↑</option>
          <option value="score_desc">Score ↓</option>
        </select>
        <span id="chunk-count" style="font-size:11px;color:var(--dim);margin-left:auto"></span>
      </div>
      <div id="chunk-list"></div>
    </div>
  </div>
</div>

<script>
const OBS_API = '{{ obs_api_base }}';
let allChunks = [];

async function loadDocs() {
  const collection = document.getElementById('collection-select').value;
  try {
    const r = await fetch(`${OBS_API}/chunks/docs?collection=${collection}&limit=50`);
    const docs = r.ok ? await r.json() : [];
    const el = document.getElementById('doc-list');
    if (!docs.length) {
      el.innerHTML = '<div class="doc-item" style="color:var(--dim);font-size:11px">No documents indexed yet.</div>';
      return;
    }
    el.innerHTML = docs.map(d => `
      <div class="doc-item" onclick="loadChunks('${escHtml(d.doc_id)}', this)">
        <div class="doc-id">${escHtml(d.doc_id.slice(0, 28))}…</div>
        <div class="doc-meta">
          <span>${d.chunk_count} chunks</span>
          <span>${escHtml(d.chunker_type || '—')}</span>
        </div>
      </div>`).join('');
  } catch (e) {
    document.getElementById('doc-list').innerHTML =
      `<div class="doc-item" style="color:var(--red);font-size:11px">Error: ${escHtml(e.message)}</div>`;
  }
}

async function loadChunks(docId, el) {
  document.querySelectorAll('.doc-item').forEach(i => i.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('empty-state').style.display = 'none';
  document.getElementById('chunk-view').style.display = 'block';
  document.getElementById('chunk-list').innerHTML = '<div style="padding:20px;display:flex;gap:8px;align-items:center"><span class="spinner"></span> Loading chunks…</div>';

  const collection = document.getElementById('collection-select').value;
  try {
    const [chunksR, summaryR] = await Promise.all([
      fetch(`${OBS_API}/chunks/${encodeURIComponent(docId)}?collection=${collection}`),
      fetch(`${OBS_API}/chunks/${encodeURIComponent(docId)}/summary?collection=${collection}`),
    ]);
    allChunks = chunksR.ok ? await chunksR.json() : [];
    const summary = summaryR.ok ? await summaryR.json() : {};
    renderQualityBar(summary);
    filterChunks();
  } catch (e) {
    document.getElementById('chunk-list').innerHTML =
      `<div style="padding:20px;color:var(--red);font-size:12px">Error: ${escHtml(e.message)}</div>`;
  }
}

function renderQualityBar(s) {
  const bar = document.getElementById('quality-bar');
  if (!s || !s.total) { bar.innerHTML = ''; return; }
  bar.innerHTML = `
    <div class="q-stat"><div class="q-stat-val" style="color:var(--text)">${s.total || 0}</div><div class="q-stat-label">Total Chunks</div></div>
    <div class="q-stat"><div class="q-stat-val" style="color:var(--green)">${s.accepted || 0}</div><div class="q-stat-label">Accepted</div></div>
    <div class="q-stat"><div class="q-stat-val" style="color:var(--orange)">${s.flagged || 0}</div><div class="q-stat-label">Flagged</div></div>
    <div class="q-stat"><div class="q-stat-val" style="color:var(--red)">${s.excluded || 0}</div><div class="q-stat-label">Excluded</div></div>
    <div class="q-stat"><div class="q-stat-val" style="color:var(--gold)">${s.avg_quality_score ?? '—'}</div><div class="q-stat-label">Avg Score</div></div>
  `;
}

function filterChunks() {
  const actionF = document.getElementById('action-filter').value;
  const sortBy  = document.getElementById('sort-by').value;
  let chunks = allChunks.filter(c => !actionF || (c.quality_action||'accepted') === actionF);
  if (sortBy === 'score_asc') chunks.sort((a,b) => (a.quality_score||0)-(b.quality_score||0));
  else if (sortBy === 'score_desc') chunks.sort((a,b) => (b.quality_score||0)-(a.quality_score||0));
  else chunks.sort((a,b) => (a.chunk_index||0)-(b.chunk_index||0));
  document.getElementById('chunk-count').textContent = `${chunks.length} chunk${chunks.length===1?'':'s'}`;
  renderChunks(chunks);
}

function renderChunks(chunks) {
  const el = document.getElementById('chunk-list');
  if (!chunks.length) {
    el.innerHTML = '<div class="empty-state">No chunks match the filter.</div>';
    return;
  }
  el.innerHTML = chunks.map((c, i) => {
    const score = c.quality_score;
    const action = c.quality_action || 'accepted';
    const scoreClass = score == null ? '' : score >= 0.7 ? 'score-good' : score >= 0.4 ? 'score-warn' : 'score-bad';
    const scoreStr = score != null ? score.toFixed(3) : '—';
    const actionClass = `action-${action}`;
    const cardClass = action === 'excluded' ? 'excluded' : action === 'flagged' ? 'flagged' : '';
    const preview = (c.text || '').slice(0, 120) + ((c.text||'').length > 120 ? '…' : '');
    return `
      <div class="chunk-card ${cardClass}">
        <div class="chunk-header" onclick="toggleChunk(this)">
          <span class="chunk-idx">#${c.chunk_index ?? i}</span>
          <span class="chunk-score ${scoreClass}">${scoreStr}</span>
          <span class="chunk-action ${actionClass}">${action}</span>
          <span style="font-size:11px;color:var(--muted);flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;margin-left:8px">${escHtml(preview)}</span>
          <span class="chunk-tokens">${c.token_count ?? '?'}t</span>
        </div>
        <div class="chunk-body">
          <div class="chunk-text">${escHtml(c.text || '')}</div>
          ${c.quality_reason ? `<div class="chunk-reason">${escHtml(c.quality_reason)}</div>` : ''}
        </div>
      </div>`;
  }).join('');
}

function toggleChunk(header) {
  header.nextElementSibling.classList.toggle('open');
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

loadDocs();
</script>
</body>
</html>
