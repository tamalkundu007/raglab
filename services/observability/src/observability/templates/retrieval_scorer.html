<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAGLab — Retrieval Scorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Syne:wght@600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
  <style>
    :root{--bg:#0a0a0f;--surface:#111118;--card:#1c1c25;--elevated:#18181f;--gold:#d4a843;--gold-dim:rgba(212,168,67,.12);--text:#f0ede8;--muted:#9a9490;--dim:#5a5650;--green:#3ecf8e;--blue:#5e9cf5;--orange:#f0944d;--red:#f26464;--purple:#a78bfa;--border:rgba(212,168,67,.15);--border-hi:rgba(212,168,67,.45);--mono:'JetBrains Mono',monospace;--display:'Syne',sans-serif;--ui:'Space Mono',monospace}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--text);font-family:var(--mono);font-size:13px;line-height:1.6;min-height:100vh}
    ::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:rgba(212,168,67,.25);border-radius:3px}
    .topbar{display:flex;align-items:center;gap:14px;padding:0 20px;height:50px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
    .logo{font-family:var(--display);font-size:15px;font-weight:800;color:var(--gold);text-decoration:none;display:flex;align-items:center;gap:8px}
    .logo-hex{width:22px;height:22px;background:var(--gold);clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--bg);font-weight:800}
    .badge{font-family:var(--ui);font-size:9px;font-weight:700;padding:2px 7px;border-radius:3px;letter-spacing:.08em;text-transform:uppercase;background:rgba(240,148,77,.12);color:var(--orange);border:1px solid rgba(240,148,77,.3)}
    .topbar-spacer{flex:1}
    .back-link{font-family:var(--ui);font-size:11px;color:var(--muted);text-decoration:none}
    .main{padding:24px;max-width:1100px;margin:0 auto}
    .section{margin-bottom:28px}
    .section-title{font-family:var(--ui);font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--orange);margin-bottom:12px}
    .stat-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
    .stat{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px 16px;flex:1;min-width:110px}
    .stat-val{font-family:var(--display);font-size:22px;font-weight:800;line-height:1;margin-bottom:3px}
    .stat-label{font-size:9px;font-family:var(--ui);text-transform:uppercase;letter-spacing:.1em;color:var(--dim)}
    table{width:100%;border-collapse:collapse;font-size:11px}
    th{font-family:var(--ui);font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);padding:7px 10px;border-bottom:1px solid var(--border);text-align:left;background:var(--surface)}
    td{padding:8px 10px;border-bottom:1px solid rgba(212,168,67,.05);vertical-align:middle}
    tr:hover td{background:rgba(212,168,67,.02)}
    .score-pill{display:inline-block;padding:1px 6px;border-radius:3px;font-family:var(--ui);font-size:10px;font-weight:700}
    .score-good{background:rgba(62,207,142,.1);color:var(--green)}
    .score-warn{background:rgba(240,148,77,.1);color:var(--orange)}
    .score-bad{background:rgba(242,100,100,.1);color:var(--red)}
    .strategy-pill{display:inline-block;padding:1px 6px;border-radius:3px;font-family:var(--ui);font-size:9px;background:rgba(94,156,245,.1);color:var(--blue);border:1px solid rgba(94,156,245,.2)}
    .healed-badge{background:rgba(167,139,250,.1);color:var(--purple);border:1px solid rgba(167,139,250,.2);font-family:var(--ui);font-size:9px;padding:1px 5px;border-radius:3px}
    #dist-chart{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px}
    .empty{padding:20px;text-align:center;color:var(--dim);font-size:11px}
    .spinner{width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--orange);border-radius:50%;animation:spin .6s linear infinite;display:inline-block}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
<header class="topbar">
  <a class="logo" href="{{ control_panel_url }}"><div class="logo-hex">R</div>RAGLab</a>
  <span class="badge">R6 · Retrieval Scorer</span>
  <div class="topbar-spacer"></div>
  <a class="back-link" href="{{ control_panel_url }}">← Control Panel</a>
</header>

<div class="main">

  <div class="section">
    <div class="section-title">Retrieval Health (Last 24h)</div>
    <div class="stat-row" id="heal-stats">
      <div class="stat"><div class="stat-val">—</div><div class="stat-label">Total Queries</div></div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Score Distribution</div>
    <div id="dist-chart"><div class="empty"><span class="spinner"></span> Loading…</div></div>
  </div>

  <div class="section">
    <div class="section-title">Recent Queries</div>
    <div id="query-table"><div class="empty"><span class="spinner"></span> Loading…</div></div>
  </div>

</div>

<script>
const OBS_API = '{{ obs_api_base }}';

async function loadAll() {
  await Promise.all([loadHealStats(), loadDistribution(), loadQueries()]);
}

async function loadHealStats() {
  try {
    const r = await fetch(`${OBS_API}/retrieval/healing`);
    if (!r.ok) return;
    const s = await r.json();
    const totalQ = s.total_queries ?? 0;
    const healed = s.healed_count ?? 0;
    const healPct = totalQ > 0 ? Math.round((healed / totalQ) * 100) : 0;
    const avgScore = s.avg_top_score ?? '—';
    document.getElementById('heal-stats').innerHTML = `
      <div class="stat"><div class="stat-val" style="color:var(--text)">${totalQ}</div><div class="stat-label">Total Queries</div></div>
      <div class="stat"><div class="stat-val" style="color:var(--purple)">${healed}</div><div class="stat-label">Healed</div></div>
      <div class="stat"><div class="stat-val" style="color:var(--orange)">${healPct}%</div><div class="stat-label">Heal Rate</div></div>
      <div class="stat"><div class="stat-val" style="color:var(--gold)">${avgScore}</div><div class="stat-label">Avg Top Score</div></div>
    `;
  } catch {}
}

async function loadDistribution() {
  const el = document.getElementById('dist-chart');
  try {
    const r = await fetch(`${OBS_API}/retrieval/distribution`);
    if (!r.ok) { el.innerHTML = '<div class="empty">No data yet.</div>'; return; }
    const data = await r.json();
    if (!data.length) { el.innerHTML = '<div class="empty">No score data yet.</div>'; return; }
    renderDistChart(data, el);
  } catch (e) {
    el.innerHTML = `<div class="empty" style="color:var(--red)">Error: ${escHtml(e.message)}</div>`;
  }
}

function renderDistChart(data, container) {
  container.innerHTML = '';
  const W = container.clientWidth - 32;
  const H = 140;
  const M = { top: 10, right: 10, bottom: 30, left: 40 };
  const w = W - M.left - M.right;
  const h = H - M.top - M.bottom;

  const BUCKET_COLOURS = { '0.0-0.2':'#f26464','0.2-0.4':'#f0944d','0.4-0.6':'#d4a843','0.6-0.8':'#3ecf8e','0.8-1.0':'#5e9cf5' };

  const x = d3.scaleBand().domain(data.map(d => d.bucket)).range([0, w]).padding(0.2);
  const y = d3.scaleLinear().domain([0, d3.max(data, d => +d.count) || 1]).range([h, 0]);

  const svg = d3.select(container).append('svg').attr('width', W).attr('height', H);
  const g = svg.append('g').attr('transform', `translate(${M.left},${M.top})`);

  g.selectAll('rect').data(data).join('rect')
    .attr('x', d => x(d.bucket)).attr('y', d => y(+d.count))
    .attr('width', x.bandwidth()).attr('height', d => h - y(+d.count))
    .attr('fill', d => BUCKET_COLOURS[d.bucket] || '#9a9490').attr('opacity', 0.8).attr('rx', 3);

  g.selectAll('.bar-label').data(data).join('text')
    .attr('x', d => x(d.bucket) + x.bandwidth()/2).attr('y', d => y(+d.count) - 4)
    .attr('text-anchor','middle').attr('fill','var(--muted)').attr('font-size',10).text(d => d.count);

  g.append('g').attr('transform', `translate(0,${h})`).call(d3.axisBottom(x).tickSize(0))
    .selectAll('text').attr('fill','var(--dim)').attr('font-size',9).attr('font-family','Space Mono');
  g.append('g').call(d3.axisLeft(y).ticks(4).tickSize(-w))
    .selectAll('line').attr('stroke','rgba(212,168,67,.06)');
  g.select('.domain').remove();
  g.selectAll('.tick text').attr('fill','var(--dim)').attr('font-size',9);
}

async function loadQueries() {
  const el = document.getElementById('query-table');
  try {
    const r = await fetch(`${OBS_API}/retrieval/queries?limit=50`);
    if (!r.ok) { el.innerHTML = '<div class="empty">No data.</div>'; return; }
    const queries = await r.json();
    if (!queries.length) { el.innerHTML = '<div class="empty">No retrieval queries recorded yet.</div>'; return; }
    el.innerHTML = `
      <table>
        <thead><tr>
          <th>Query</th><th>Strategy</th><th>Results</th>
          <th>Top Score</th><th>Duration</th><th>Healed</th>
        </tr></thead>
        <tbody>${queries.map(q => {
          const score = q.top_score;
          const scoreClass = score == null ? '' : score >= 0.7 ? 'score-good' : score >= 0.4 ? 'score-warn' : 'score-bad';
          const scoreStr = score != null ? score.toFixed(3) : '—';
          const healed = q.healed === 'true';
          const queryPreview = (q.query_text || q.operation_name || '—').slice(0, 45);
          const strat = q.final_strategy || q.retriever_type || '—';
          return `<tr>
            <td style="color:var(--text)">${escHtml(queryPreview)}</td>
            <td><span class="strategy-pill">${escHtml(strat)}</span></td>
            <td style="color:var(--muted)">${q.result_count ?? '—'}</td>
            <td><span class="score-pill ${scoreClass}">${scoreStr}</span></td>
            <td style="color:var(--dim)">${q.duration_ms ?? '—'}ms</td>
            <td>${healed ? '<span class="healed-badge">healed</span>' : '<span style="color:var(--dim);font-size:9px">—</span>'}</td>
          </tr>`;
        }).join('')}</tbody>
      </table>`;
  } catch (e) {
    el.innerHTML = `<div class="empty" style="color:var(--red)">Error: ${escHtml(e.message)}</div>`;
  }
}

function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

loadAll();
setInterval(loadAll, 30000);
</script>
</body>
</html>
