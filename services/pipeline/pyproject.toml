[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "raglab-pipeline"
version = "0.1.0"
description = "End-to-end RAG pipeline orchestration"
requires-python = ">=3.12"
dependencies = [
    "raglab-common",
    "raglab-eval",
    "raglab-chunkers",
    "raglab-retrievers",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "aio-pika>=9.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]
