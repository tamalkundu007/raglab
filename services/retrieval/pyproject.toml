[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "raglab-retrieval"
version = "0.1.0"
description = "Retriever execution — dense, BM25, hybrid, MMR, re-ranker"
requires-python = ">=3.12"
dependencies = [
    "raglab-common",
    "raglab-retrievers",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "qdrant-client>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/retrieval"]
