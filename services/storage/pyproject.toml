[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "raglab-storage"
version = "0.2.0"
description = "File storage backend abstraction — local, S3, Azure Blob, GCS"
requires-python = ">=3.12"
dependencies = [
    "raglab-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "boto3>=1.35",
    "azure-storage-blob>=12.22",
]

[tool.hatch.build.targets.wheel]
packages = ["src/storage"]
