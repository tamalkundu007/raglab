[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "raglab-ui"
version = "0.1.0"
description = "Control Panel UI — Jinja2 + Alpine.js"
requires-python = ">=3.12"
dependencies = [
    "raglab-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ui"]
